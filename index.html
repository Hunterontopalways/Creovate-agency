  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;

        var cursor = document.createElement("div");
        cursor.id = "creovate-cursor";
        cursor.textContent = "\uD83D\uDC7D";
        document.body.appendChild(cursor);

        var style = document.createElement("style");
        style.textContent =
          "html.creovate-cursor-active, html.creovate-cursor-active *{cursor:none !important;}" +
          "#creovate-cursor{position:fixed;top:0;left:0;font-size:22px;line-height:1;" +
          "transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:2147483647;" +
          "will-change:transform;opacity:0;transition:opacity .15s ease,transform .12s ease;" +
          "filter:drop-shadow(0 0 6px rgba(255,255,255,.35));}" +
          "#creovate-cursor.creovate-cursor-visible{opacity:1;}" +
          "#creovate-cursor.creovate-cursor-down{transform:translate(-50%,-50%) scale(0.8) rotate(-8deg);}";
        document.head.appendChild(style);

        var raf = null, x = 0, y = 0;

        function render() {
          cursor.style.transform =
            "translate(-50%,-50%) translate3d(" + x + "px," + y + "px,0) scale(1)";
          raf = null;
        }

        window.addEventListener(
          "mousemove",
          function (e) {
            document.documentElement.classList.add("creovate-cursor-active");
            cursor.classList.add("creovate-cursor-visible");
            x = e.clientX;
            y = e.clientY;
            if (!raf) raf = requestAnimationFrame(render);
          },
          { passive: true }
        );

        window.addEventListener("mousedown", function () {
          cursor.classList.add("creovate-cursor-down");
        });
        window.addEventListener("mouseup", function () {
          cursor.classList.remove("creovate-cursor-down");
        });
        document.addEventListener("mouseleave", function () {
          cursor.classList.remove("creovate-cursor-visible");
        });

        // If the visitor's device turns out to be touch-only after all, bail out cleanly.
        window.addEventListener(
          "touchstart",
          function () {
            document.documentElement.classList.remove("creovate-cursor-active");
            cursor.remove();
            style.remove();
          },
          { once: true, passive: true }
        );
      })();
    </script>
