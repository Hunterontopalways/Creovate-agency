    <style>
      /* Ambient background theme, sits fixed behind the whole site */
      #creovate-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.78)),
          url("/site-theme-bg.jpg") center / cover no-repeat;
        pointer-events: none;
      }
      /* Let the ambient background show through the site's black panels
         instead of them sitting fully opaque on top of it */
      [class="bg-black min-h-screen text-white overflow-x-hidden selection:bg-white/20 selection:text-white"],
      [class="relative min-h-[100dvh] flex items-center justify-center overflow-hidden bg-black pt-20"],
      [class="py-24 bg-black relative border-y border-white/5"],
      [class="py-24 md:py-32 bg-black relative"],
      [class="py-32 bg-black relative overflow-hidden border-y border-white/5"],
      [class="py-32 bg-black relative"],
      [class="border-t border-white/5 bg-black py-12 md:py-20 relative overflow-hidden"] {
        background-color: rgba(0, 0, 0, 0.62) !important;
      }
    </style>

  <body>
    <div id="creovate-bg"></div>
    <div id="root"></div>
    <script>
      (function () {
        if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;

        var cursor = document.createElement("div");
        cursor.id = "creovate-cursor";
        cursor.textContent = "\uD83D\uDC7D";
        document.body.appendChild(cursor);

        var style = document.createElement("style");
        style.textContent =
          /* hide the site's original mouse-follow dot + glow so only the alien cursor shows */
          "[class*=\"mix-blend-difference\"]{display:none !important;}" +
          "[class*=\"z-[99]\"][class*=\"blur-xl\"]{display:none !important;}" +
          "html.creovate-cursor-active, html.creovate-cursor-active *{cursor:none !important;}" +
          "#creovate-cursor{position:fixed;top:0;left:0;font-size:22px;line-height:1;" +
          "transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:2147483647;" +
          "will-change:transform;opacity:0;transition:opacity .15s ease;" +
          "filter:drop-shadow(0 0 6px rgba(255,255,255,.35));}" +
          "#creovate-cursor.creovate-cursor-visible{opacity:1;}";
        document.head.appendChild(style);

        var targetX = 0, targetY = 0, curX = 0, curY = 0, started = false, pressed = false;

        // Continuous easing loop so the alien glides smoothly to the pointer
        // instead of snapping straight to it on every mousemove tick.
        function tick() {
          curX += (targetX - curX) * 0.18;
          curY += (targetY - curY) * 0.18;
          var extra = pressed ? " scale(0.8) rotate(-8deg)" : " scale(1)";
          cursor.style.transform =
            "translate(-50%,-50%) translate3d(" + curX + "px," + curY + "px,0)" + extra;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        window.addEventListener(
          "mousemove",
          function (e) {
            document.documentElement.classList.add("creovate-cursor-active");
            cursor.classList.add("creovate-cursor-visible");
            targetX = e.clientX;
            targetY = e.clientY;
            if (!started) {
              started = true;
              curX = targetX;
              curY = targetY;
            }
          },
          { passive: true }
        );

        window.addEventListener("mousedown", function () {
          pressed = true;
        });
        window.addEventListener("mouseup", function () {
          pressed = false;
        });
        document.addEventListener("mouseleave", function () {
          cursor.classList.remove("creovate-cursor-visible");
        });

        // If the visitor's device turns out to be touch-only after all, bail out cleanly.
        window.addEventListener(
          "touchstart",
          function () {
            document.documentElement.classList.remove("creovate-cursor-active");
            cursor.remove();
            style.remove();
          },
          { once: true, passive: true }
        );
      })();
    </script>
